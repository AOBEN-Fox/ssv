# Site Safety Vision - 运行时配置示例
# 此文件只用于复制，不参与默认配置搜索。请复制为 config/ssv.yaml 或项目根目录 ssv.yaml 后再修改；
# 也可以通过 SSV_CONFIG_PATH 显式指定任意运行配置文件。
#
# 环境变量覆盖 (优先级高于 YAML)，只保留适合部署和临时调试的少量变量:
#   REDIS_HOST        → redis.host
#   REDIS_PORT        → redis.port
#   SSV_RTSP_URL      → sources[0].uri
#   GST_DEBUG         → logging.cpp_debug_level

# 配置版本号
version: "1.0"

# 日志配置
logging:
  # C++ GStreamer 插件的 GST_DEBUG 模式（如 "ssv*:5" 启用所有 SSV 插件 DEBUG 级别）
  cpp_debug_level: "ssv*:4"
  # Python agent 服务日志级别（DEBUG, INFO, WARNING, ERROR）
  python_log_level: "INFO"

# Redis 连接配置（M5 起使用）
redis:
  host: "localhost"
  port: 6379
  db: 0
  # Redis Streams 键名，检测事件写入此流
  stream_key: "ssv:events"
  # 安全帽单帧复验候选写入此流
  review_candidate_stream: "ssv:review-candidates"
  # 安全帽复验结果写入此流
  review_result_stream: "ssv:review-results"
  # 消费者组名称，agent 服务从此组消费事件
  consumer_group: "ssv-agent"

# 视频源配置（M2 起使用）
sources: []
#  示例：
#  - name: "camera-01"
#    type: "rtsp"
#    uri: "rtsp://192.168.1.100:554/stream"
#    protocols: "tcp"
#    latency_ms: 200
#  - name: "test-video"
#    type: "file"
#    uri: "/path/to/video.mp4"

# 显示配置（M2 起使用）
display:
  # 是否开启 GStreamer 本地显示窗口
  enabled: false
  # 是否默认开启检测框 overlay
  overlay: false
  # 显示分支帧率
  fps: 30
  # 视频 sink 元素；空值表示自动选择支持 sync 和 max-lateness 的具体 sink
  sink: ""
  # 当前帧完成后只保留最新等待帧，并按 pipeline clock 丢弃过迟帧
  latest_frame: true
  # 内置位图标签字体；face 支持 regular 或 bold，size 为 7..64 像素
  overlay_font:
    face: regular
    size: 7
  # 仅影响 ssvoverlay 展示，不回写 tracker、Redis、事件或证据
  motion_prediction:
    enabled: true
    # 展示预测与 hold-last 的最大新鲜度时域，允许 1..300 ms
    max_horizon_ms: 300

# Pipeline 配置（M2 起使用）
pipeline:
  # 链路冒烟测试超时
  check_timeout: "30s"
  # 分析帧率（每秒抽取多少帧进行分析）；设为 0 表示不限流
  analysis_fps: 5
  # 分析帧宽度
  frame_width: 640
  # 分析帧高度
  frame_height: 480

# 推理配置（M3 起使用）
inference:
  # 推理运行时：auto 根据模型后缀选择；onnxruntime 加载 .onnx；tensorrt 加载 .engine
  runtime: "auto"
  # 模型文件路径；工程实时链路不直接加载 .pt
  model_path: "models/yolov8n.onnx"
  # 检测置信度阈值
  confidence_threshold: 0.5
  # 推理设备：auto、cpu、gpu
  device: "auto"
  # 通用设备编号；GPU 后端使用
  device_id: 0
  # 推理精度意图：auto、fp32、fp16、int8
  precision: "auto"
  # 模型家族；本阶段支持 yolo
  model_family: "yolo"
  # 输出格式：auto、yolov5、yolov8、yolo_nx6
  output_format: "auto"
  # 只输出指定类别；空字符串表示不过滤
  target_class: "person"
  # 模型类别表，每行一个类别名，行号对应 class_id
  label_map: "config/model-labels/coco80.txt"

# 跟踪配置（M2 起使用）
tracking:
  # 是否启用跟踪插件
  enabled: true
  # 跟踪算法使用的帧率估计
  frame_rate: 30
  # 保留检测进入跟踪的置信度阈值
  track_threshold: 0.5
  # 轨迹丢失后的保留帧数
  track_buffer: 30
  # IoU 匹配阈值
  match_threshold: 0.3
  # 无真实检测时使用 mock track
  mock_track: false

# 事件证据归档配置
artifacts:
  events_root: "artifacts/events"

# 单帧安全帽复验配置；默认关闭，不影响 detection 流
review:
  enabled: false
  automatic_decision_min_confidence: 0.80

# Agent 配置（M6 起使用）
agent:
  # 状态机单次处理超时（秒）
  state_machine_timeout: 300
  # 工具调用最大重试次数
  max_retries: 3
  # review.enabled=true 时唯一选择的视觉模型名称
  review_model: ""
  # 模型 provider 配置；真实 provider 仅可通过环境变量引用凭据
  models: []
